name: CI

# ScanTTY's first CI.
#   * Every pull request and every push to main: build / vet / test, plus
#     internal/tui's heavy tests in shards of their own (see tui-heavy).
#   * On merges to main it ALSO publishes prebuilt binaries as a GitHub Release
#     so any host can pull a fresh build instead of compiling from source
#     (this is what keeps the running binary from going stale — see
#     deploy/README.md for the host side that consumes it).

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that PR's older run that is still going:
# only the newest commit's result counts, and the superseded run would hold
# runners for its full length. Pushes to main key on the run id instead, so
# every merge gets a group of its own and runs to completion (the release job
# below must see each one through).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# go.mod pins the Go version (currently 1.26.4). setup-go installs it from
# go-version-file; GOTOOLCHAIN=auto is a safety net so the `go` command can
# fetch the exact go.mod-pinned toolchain if the runner baseline is older.
env:
  GOTOOLCHAIN: auto

jobs:
  build-vet-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # internal/tui's heavy tests are not in this run: its TestMain skips the
      # ones internal/tui/testdata/heavy_tests.txt lists, and the tui-heavy
      # job below runs them. Every test still runs on every PR, in exactly one
      # of the two (internal/tui/test_schedule_test.go owns that and checks it).
      #
      # 6m, down from the 20m stopgap #170 put here. The split was made because
      # the package had reached 1008-1019s on this runner against that bound,
      # and a HUNG test took 20 minutes to report. What remains measured 124s
      # locally, against 678s for the whole package on the same machine, and
      # this runner has run the package about 1.5x slower than that machine;
      # so roughly 190s is expected, and 6m is under 2x of it — short enough
      # that a hang reports inside six minutes, with room for ordinary growth.
      # A timeout here that is not a hang means the ordinary suite grew: move
      # the heaviest ordinary tests into heavy_tests.txt rather than raising
      # this number back up.
      - name: go test
        run: go test -timeout 6m ./...

  # The shard numbers in heavy_tests.txt ARE the matrix, read from the file
  # rather than restated here, so adding a shard there adds a job and no shard
  # can be listed there and forgotten here.
  tui-heavy-plan:
    name: plan tui heavy shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          shards="$(grep -vE '^[[:space:]]*(#|$)' internal/tui/testdata/heavy_tests.txt | awk '{print $1}' | sort -un | jq -cs .)"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "tui heavy shards: ${shards}"

  tui-heavy:
    name: tui heavy tests (shard ${{ matrix.shard }})
    needs: tui-heavy-plan
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one failing sweep must not hide another's result.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.tui-heavy-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 10m per shard. The three shards measured 155s, 195s and 206s locally
      # (the whole package: 678s on the same machine, 1008-1019s on this
      # runner), so about 300s each is expected here and a shard has roughly
      # 2x; a hang reports in ten minutes rather than twenty. When a shard nears
      # its bound the answer is another shard number in heavy_tests.txt, not a
      # bigger number here (shard 1 reached it on 2026-09-25 and shard 4 was
      # split out of it; heavy_tests.txt has the numbers). The script fails the
      # job unless every test marked for the shard reported a PASS, so a shard
      # that silently ran nothing cannot go green.
      - name: go test (heavy shard ${{ matrix.shard }})
        run: .github/scripts/tui-heavy-shard.sh "${{ matrix.shard }}" -timeout 10m

  release:
    name: release prebuilt binaries
    needs: [build-vet-test, tui-heavy]
    # Only publish on a real merge to main, never on pull_request runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries (static, linux/amd64)
        env:
          # modernc.org/sqlite is pure Go, so CGO can stay off -> a portable
          # static binary that runs on any linux/amd64 host.
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/scantty ./cmd/scantty
          go build -trimpath -o dist/oms-claim-print ./cmd/oms-claim-print
      - name: Publish GitHub Release
        # GITHUB_SHA / GITHUB_REPOSITORY are provided automatically by Actions.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          TITLE="ScanTTY build $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"
          NOTES="Automated linux/amd64 build from main @ ${GITHUB_SHA} (static, CGO disabled). Assets: scantty (TUI) and oms-claim-print (Pi print daemon). Pull with: gh release download --repo ${GITHUB_REPOSITORY} --pattern scantty --clobber"
          # Idempotent: a re-run on the same commit replaces the release cleanly
          # instead of failing on an existing tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest \
            dist/scantty dist/oms-claim-print
